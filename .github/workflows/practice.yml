name: practice
on: push
jobs:
  lint_test_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./19
    steps:
      - name: get repo
        uses: actions/checkout@v4
      - name: directory checkout
        run: ls
      - name: directory path print
        run: pwd
      - name: directory checkout
        run: ls
      - name: install
        run: npm install
      - name: lint
        run: npm run lint
      - name: test
        run: npm run test
      - name: build
        run: npm run build
  deploy:
    needs: lint_test_build
    runs-on: ubuntu-latest
    steps:
      - name: get repo
        uses: actions/checkout@v4
      - name: navigate to project's folder
        run: cd ./19
      - name: run the app
        run: npm run dev
